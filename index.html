<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Na Medida - Gestão Alimentar Escolar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="flex h-screen overflow-hidden">
    <div class="w-64 bg-white border-r border-gray-200 flex flex-col">
        <div class="p-6 border-b">
            <h1 class="text-2xl font-bold text-emerald-600">Na Medida</h1>
            <p class="text-xs text-gray-500">Gestão Alimentar Escolar</p>
        </div>

        <nav class="flex-1 p-4 space-y-1">
            <a href="#" onclick="showPage('dashboard')" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl sidebar-active">
                <i class="fas fa-home w-5"></i><span>Dashboard</span>
            </a>
            <a href="#" onclick="showPage('cozinha')" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100">
                <i class="fas fa-kitchen-set w-5"></i><span>Cozinha</span>
            </a>
            <a href="#" onclick="showPage('cardapio')" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100">
                <i class="fas fa-utensils w-5"></i><span>Cardápio</span>
            </a>
            <a href="#" onclick="showPage('relatorios')" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100">
                <i class="fas fa-chart-bar w-5"></i><span>Relatórios</span>
            </a>
            <a href="#" onclick="showPage('avaliacao')" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100">
                <i class="fas fa-star w-5"></i><span>Avaliação</span>
            </a>
        </nav>
    </div>

    <div class="flex-1 overflow-auto">
        <header class="bg-white border-b px-8 py-4 flex items-center justify-between">
            <h2 id="page-title" class="text-2xl font-semibold text-gray-800">Dashboard</h2>
            <p class="text-sm font-medium">25 de maio de 2026</p>
        </header>

        <div id="dashboard" class="page active p-8">Dashboard</div>
        <div id="cozinha" class="page hidden p-8">Cozinha</div>
        <div id="cardapio" class="page hidden p-8">Cardápio</div>

        <div id="relatorios" class="page hidden p-8">
            <h2 class="text-2xl font-bold mb-6">Estatísticas de Avaliações</h2>
            <div id="stats-content" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>

        <div id="avaliacao" class="page hidden p-8">
            <div class="max-w-lg mx-auto bg-white rounded-3xl p-10 shadow-sm">
                <h2 class="text-2xl font-bold text-center mb-2">Avaliação do Cardápio</h2>
                <p class="text-center text-gray-600 mb-8">Sua opinião ajuda a melhorar o cardápio da escola!</p>

                <div class="mb-8">
                    <p class="font-medium mb-4 text-center">Como você avalia a refeição de hoje?</p>
                    <div class="flex justify-center gap-12 text-6xl" id="emoji-buttons">
                        <button data-rating="bom" class="hover:scale-125 transition">👍</button>
                        <button data-rating="medio" class="hover:scale-125 transition">😐</button>
                        <button data-rating="ruim" class="hover:scale-125 transition">👎</button>
                    </div>
                </div>

                <textarea id="comentario" class="w-full border border-gray-300 rounded-2xl p-4 h-32" placeholder="Comentário (opcional)..."></textarea>

                <button id="btn-enviar" onclick="enviarAvaliacao()" class="mt-6 w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-medium">
                    <span id="btn-text">Enviar Avaliação</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
